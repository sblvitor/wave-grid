<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <script>
      (function() {
        const saved = localStorage.getItem('theme')
        document.documentElement.setAttribute('data-theme', saved || 'light')
      })();
    </script>
    <link href="/src/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Grid</title>
  </head>
  <body>
    <div class="overlay">
      <header>
        <h1>Lira.dev</h1>
        <nav>
          <button type="button" class="nav-link" data-section="about">About</button>
          <button type="button" class="nav-link" data-section="experience">Experience</button>
          <button type="button" class="nav-link" data-section="projects">Projects</button>
          <button type="button" class="nav-link" data-section="contact">Contact</button>
          <button type="button" id="theme-toggle">
            <svg id="light-on" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lightbulb">
              <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6"/>
              <path d="M10 22h4"/>
            </svg>
            <svg id="light-off" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lightbulb-off">
              <path d="M16.8 11.2c.8-.9 1.2-2 1.2-3.2a6 6 0 0 0-9.3-5"/>
              <path d="m2 2 20 20"/>
              <path d="M6.3 6.3a4.67 4.67 0 0 0 1.2 5.2c.7.7 1.3 1.5 1.5 2.5"/>
              <path d="M9 18h6"/>
              <path d="M10 22h4"/>
            </svg>
          </button>
        </nav>
      </header>
      <div class="content">
        <h1>
          Software Engineer from Brazil with a passion for creative, immersive and memorable 
          experiences on the web. I enjoy turning complex ideas into something people can feel — always learning.
        </h1>
      </div>
    </div>
    <canvas class="webgl"></canvas>
    <script type="module" src="/src/script.js"></script>
  </body>
</html>
